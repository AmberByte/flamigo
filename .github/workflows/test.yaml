name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            workdir: .
            go-version-file: go.mod
          - module: tools/flamigo
            workdir: tools/flamigo
            go-version-file: tools/flamigo/go.mod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: ${{ matrix.go-version-file }}

      - name: Test
        working-directory: ${{ matrix.workdir }}
        run: go test ./...
